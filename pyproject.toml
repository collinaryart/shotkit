[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shotkit"
version = "0.1.0"
description = "A small CG-pipeline toolkit: show tree scaffolding, naming checks, immutable versioned publishes with manifests, image-sequence ingest with missing-frame detection, and Maya scene sanity checks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Collin Han"}]
keywords = ["vfx", "pipeline", "maya", "publish", "image-sequence", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/collinaryart/shotkit"
Issues = "https://github.com/collinaryart/shotkit/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shotkit = "shotkit.cli:main"

[tool.setuptools]
packages = ["shotkit", "shotkit.templates"]

[tool.setuptools.package-data]
shotkit = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
